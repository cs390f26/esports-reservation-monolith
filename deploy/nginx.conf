user nginx;
# "auto" creates one worker per CPU.
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # The Flask instance's private IP. userdata-nginx.sh replaces
    # FLASK_HOST with the address of the instance tagged esports-role=flask.
    upstream flask_app {
        server FLASK_HOST:5000;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Every request, including /inventory and the HTML pages, goes to Flask.
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
