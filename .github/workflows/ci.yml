name: CI

# Lint and test every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: esports
          MYSQL_DATABASE: esports
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pesports"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      ESPORTS_DB_HOST: 127.0.0.1
      ESPORTS_DB_PORT: "3306"
      ESPORTS_DB_USER: root
      ESPORTS_DB_PASSWORD: esports
      ESPORTS_DB_NAME: esports

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Unit tests (pytest)
        run: pytest
